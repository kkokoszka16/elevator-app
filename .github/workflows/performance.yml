name: Performance Testing

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Start application
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for application health
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 2; done'

      - name: Run load tests
        run: |
          docker run --network host \
            grafana/k6 run - <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export let options = {
            stages: [
              { duration: '30s', target: 10 },
              { duration: '1m', target: 50 },
              { duration: '30s', target: 100 },
              { duration: '1m', target: 50 },
              { duration: '30s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.01'],
            },
          };

          export default function () {
            let response = http.get('http://localhost:8080/actuator/health');
            check(response, {
              'status is 200': (r) => r.status === 200,
            });
            sleep(1);
          }
          EOF

      - name: Collect logs
        if: always()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down

  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Run JMH benchmarks
        run: ./mvnw clean install -DskipTests -Pbenchmark || echo "Benchmark profile not configured"

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: '**/target/jmh-result.json'
