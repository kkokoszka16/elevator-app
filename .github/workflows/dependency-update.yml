name: Dependency Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Check for Maven updates
        run: ./mvnw versions:display-dependency-updates

      - name: Check for plugin updates
        run: ./mvnw versions:display-plugin-updates

      - name: Update dependencies
        run: |
          ./mvnw versions:use-latest-releases
          ./mvnw versions:update-properties

      - name: Build and test with updates
        run: ./mvnw clean verify

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'Automated dependency updates'
          body: |
            Automated dependency updates generated by GitHub Actions.

            Please review changes carefully before merging.
          branch: dependency-updates
          delete-branch: true
